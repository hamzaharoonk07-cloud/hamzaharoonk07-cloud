<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"><animate attributeName="stop-color" values="#fbbf24;#f97316;#fbbf24" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#f97316"><animate attributeName="stop-color" values="#f97316;#db2777;#f97316" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#db2777"><animate attributeName="stop-color" values="#db2777;#7c3aed;#db2777" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="260" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="260" fill="url(#g)"/>
    <circle cx="150" cy="40" r="120" fill="#fff" opacity="0.12"><animate attributeName="cy" values="40;80;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="210" r="150" fill="#fff" opacity="0.10"><animate attributeName="cy" values="210;170;210" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="-30" r="90" fill="#fff" opacity="0.10"><animate attributeName="cx" values="640;720;640" dur="9s" repeatCount="indefinite"/></circle>
    <text x="600" y="125" text-anchor="middle" font-family="Poppins,Segoe UI,Arial,sans-serif" font-weight="800" font-size="76" fill="#fff" style="letter-spacing:1px">Muhammad Hamza</text>
    <text x="600" y="180" text-anchor="middle" font-family="Poppins,Segoe UI,Arial,sans-serif" font-weight="500" font-size="28" fill="#fff" opacity="0.92">Full Stack &amp; App Developer</text>
    <text x="600" y="222" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="18" fill="#fff" opacity="0.8">React · Node · MongoDB · Kotlin · Wear OS</text>
  </g>
</svg>
